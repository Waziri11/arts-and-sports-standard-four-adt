name: Deploy ADT book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/videos/*
            /videos/page_1.mp4
            /videos/page_81.mp4
          sparse-checkout-cone-mode: false

      - name: Check sign-language playback regressions
        run: node --test tests/sign-language.test.cjs

      - name: Check embedded reader resources are current
        run: |
          python3 scripts/refresh-offline-preloader.py
          git diff --exit-code -- assets/offline-preloader.js

      - name: Check responsive toolbar installation
        run: python3 scripts/verify-reader-toolbar.py

      - name: Validate and stage the published reader
        run: python3 scripts/prepare-pages.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the published reader
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish the book
        id: deployment
        uses: actions/deploy-pages@v4
